spring:
  application:
    name: league-platform
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/league}
    username: ${DB_USER:league}
    password: ${DB_PASSWORD:league}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  session:
    timeout: 30d
    jdbc:
      # Tables are created by Flyway (V3).
      initialize-schema: never
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      # Screenshots are capped at 5 MB (checked again in Uploads); a little room for the form fields.
      max-file-size: 5MB
      max-request-size: 6MB
  modulith:
    events:
      # Notifications and Discord posts run after commit; any that didn't finish are retried on startup.
      republish-outstanding-events-on-restart: true

server:
  port: ${PORT:8080}
  # Trust X-Forwarded-* from the Vite/nginx proxy so OAuth redirect URLs use the public host.
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  version: 0.0.1
  # Where people open the app; used for links in Discord posts.
  public-url: ${APP_PUBLIC_URL:http://localhost:3000}
  # Screenshot storage: any S3-compatible service. The defaults match the storage service in docker-compose.yml.
  storage:
    endpoint: ${STORAGE_ENDPOINT:http://localhost:8333}
    region: ${STORAGE_REGION:us-east-1}
    bucket: ${STORAGE_BUCKET:league-uploads}
    access-key: ${STORAGE_ACCESS_KEY:league}
    secret-key: ${STORAGE_SECRET_KEY:league-secret}

---
# Local development: enables name-only "dev login" (never enable in production).
spring:
  config:
    activate:
      on-profile: dev

---
# Google sign-in. Activate with the "google" profile and set the two variables.
# Redirect URI to register: <app origin>/login/oauth2/code/google
spring:
  config:
    activate:
      on-profile: google
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid,profile,email

---
# Discord sign-in. Activate with the "discord" profile and set the two variables.
# Redirect URI to register: <app origin>/login/oauth2/code/discord
spring:
  config:
    activate:
      on-profile: discord
  security:
    oauth2:
      client:
        registration:
          discord:
            client-id: ${DISCORD_CLIENT_ID}
            client-secret: ${DISCORD_CLIENT_SECRET}
            client-name: Discord
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: identify,email
        provider:
          discord:
            authorization-uri: https://discord.com/oauth2/authorize
            token-uri: https://discord.com/api/oauth2/token
            user-info-uri: https://discord.com/api/users/@me
            user-name-attribute: id
