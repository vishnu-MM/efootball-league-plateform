spring:
  application:
    name: league-platform
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/league}
    username: ${DB_USER:league}
    password: ${DB_PASSWORD:league}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  version: 0.0.1
