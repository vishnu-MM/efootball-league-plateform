server {
    listen 80;
    root /usr/share/nginx/html;

    # Forward API and sign-in routes to the backend so the browser sees one origin
    # (the session cookie and OAuth redirect URLs then belong to this host).
    location ~ ^/(api|oauth2|login/oauth2)/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Server-sent events (live updates) must not be buffered.
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    # Single-page app: unknown paths fall back to index.html.
    location / {
        try_files $uri /index.html;
    }

    # The service worker must never be cached, so updates reach users.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
}
