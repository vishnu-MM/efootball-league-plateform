# Development:  docker compose up -d db        (then run backend and frontend locally)
# Full stack:   docker compose up --build      (app on http://localhost:3000)
name: league-platform

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-league}
      POSTGRES_USER: ${DB_USER:-league}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-league}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-league} -d ${DB_NAME:-league}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-league}
      DB_USER: ${DB_USER:-league}
      DB_PASSWORD: ${DB_PASSWORD:-league}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  db-data:
